---
layout: default
---

<header class="page-header">
  <h1 class="page-title">{{ page.title }}</h1>
</header>

<div class="tag-cloud">
  {% assign sorted_tags = site.tags | sort %}
  {% for tag in sorted_tags %}
    <a href="{{ '/tags/' | append: tag[0] | relative_url }}" class="tag-link">{{ tag[0] }} <span class="tag-count">{{ tag[1].size }}</span></a>
  {% endfor %}
</div>
