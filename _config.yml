# Site Settings
title: Joe Platta
description: >-
  Joe Platta's personal website
url: "https://jwplatta.github.io"
baseurl: ""
lang: en

# Author
author:
  name: Joe Platta
  email: jwplatta@gmail.com

# Social
github:
  username: jwplatta
social:
  name: Joe Platta
  email: jwplatta@gmail.com
  links:
    - https://github.com/jwplatta
    - https://www.linkedin.com/in/jwplatta

# Build
plugins:
  - jekyll-archives
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

paginate: 10

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      layout: post
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

# Archives
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - CHANGELOG.md
  - LICENSE
  - node_modules
  - package*.json
  - Gemfile.lock
