<nav class="site-nav">
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
    <button class="nav-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.nav-links').classList.toggle('active')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <ul class="nav-links">
      {% assign sorted_tabs = site.tabs | sort: "order" %}
      {% for tab in sorted_tabs %}
        <li><a href="{{ tab.url | relative_url }}">{{ tab.title }}</a></li>
      {% endfor %}
    </ul>
  </div>
</nav>
